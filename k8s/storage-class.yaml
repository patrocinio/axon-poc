---
# EBS gp3 StorageClass for Axon Server persistent volumes
# Requires EBS CSI driver installed on EKS cluster

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  iops: "3000"       # Baseline; increase for write-heavy event store
  throughput: "125"   # MB/s baseline
  encrypted: "true"
  kmsKeyId: ""        # Add CMK ARN for customer-managed encryption
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
