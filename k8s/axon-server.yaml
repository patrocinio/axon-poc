---
# Axon Server StatefulSet — single-node (Standard Edition)
# For production HA, use Axon Server Enterprise Edition with multi-node Raft.

apiVersion: v1
kind: Namespace
metadata:
  name: axon-poc

---
# Secret containing the access token for Axon Server authentication
apiVersion: v1
kind: Secret
metadata:
  name: axon-server-token
  namespace: axon-poc
type: Opaque
stringData:
  token: "axon-poc-access-token-2024"

---
apiVersion: v1
kind: Service
metadata:
  name: axon-server
  namespace: axon-poc
  labels:
    app: axon-server
spec:
  # Headless service for StatefulSet pod DNS
  clusterIP: None
  selector:
    app: axon-server
  ports:
    - name: grpc
      port: 8124
      targetPort: 8124
    - name: cluster
      port: 8224
      targetPort: 8224
    - name: http
      port: 8024
      targetPort: 8024

---
apiVersion: v1
kind: Service
metadata:
  name: axon-server-client
  namespace: axon-poc
  labels:
    app: axon-server
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: axon-server
  ports:
    - name: grpc
      port: 8124
      targetPort: 8124
    - name: http
      port: 8024
      targetPort: 8024

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: axon-server
  namespace: axon-poc
spec:
  serviceName: axon-server
  replicas: 1
  selector:
    matchLabels:
      app: axon-server
  template:
    metadata:
      labels:
        app: axon-server
    spec:
      containers:
        - name: axon-server
          image: axoniq/axonserver:2024.1.2
          ports:
            - containerPort: 8124
              name: grpc
            - containerPort: 8224
              name: cluster
            - containerPort: 8024
              name: http
          env:
            - name: AXONIQ_AXONSERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AXONIQ_AXONSERVER_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Enable access control (authentication)
            - name: AXONIQ_AXONSERVER_ACCESSCONTROL_ENABLED
              value: "true"
            # Token used for both internal and client communication
            - name: AXONIQ_AXONSERVER_ACCESSCONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: axon-server-token
                  key: token
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8024
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8024
            initialDelaySeconds: 60
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /axonserver/data
            - name: events
              mountPath: /axonserver/events
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: events
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 50Gi
