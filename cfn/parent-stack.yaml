AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Axon PoC Loan Originations - Parent Stack
  Orchestrates nested stacks for VPC, EKS, ECR, and addons.

Parameters:
  EnvironmentName:
    Type: String
    Default: axon-poc
    Description: Environment name prefix for resource naming

  VpcCidr:
    Type: String
    Default: '10.0.0.0/16'
    Description: CIDR block for the VPC

  NodeInstanceType:
    Type: String
    Default: t3.large
    Description: EC2 instance type for EKS worker nodes

  NodeGroupDesiredSize:
    Type: Number
    Default: 3
    Description: Desired number of worker nodes

  NodeGroupMinSize:
    Type: Number
    Default: 2
    Description: Minimum number of worker nodes

  NodeGroupMaxSize:
    Type: Number
    Default: 4
    Description: Maximum number of worker nodes

  GitHubOrg:
    Type: String
    Default: patrocinio
    Description: GitHub organization or username

  GitHubRepo:
    Type: String
    Default: axon-poc
    Description: GitHub repository name

  TemplatesBucketName:
    Type: String
    Description: S3 bucket containing nested stack templates

Resources:
  NetworkingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/networking.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcCidr: !Ref VpcCidr

  EksClusterStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkingStack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/eks-cluster.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkingStack.Outputs.VpcId
        PrivateSubnetIds: !GetAtt NetworkingStack.Outputs.PrivateSubnetIds
        NodeInstanceType: !Ref NodeInstanceType
        NodeGroupDesiredSize: !Ref NodeGroupDesiredSize
        NodeGroupMinSize: !Ref NodeGroupMinSize
        NodeGroupMaxSize: !Ref NodeGroupMaxSize

  EcrStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/ecr.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName

  AddonsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: EksClusterStack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/addons.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        ClusterName: !GetAtt EksClusterStack.Outputs.ClusterName
        OidcProviderArn: !GetAtt EksClusterStack.Outputs.OidcProviderArn
        OidcIssuer: !GetAtt EksClusterStack.Outputs.OidcIssuer

  # GitHub Actions OIDC Provider
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - '6938fd4d98bab03faadb97b34396831e3780aea1'
        - '1c58a3a8518e8759bf075b76b750d4f2df264fcd'

  # IAM Role for GitHub Actions CI/CD
  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-github-actions-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:*'
      Policies:
        - PolicyName: DeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ECR permissions
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !GetAtt EcrStack.Outputs.RepositoryArn
              # EKS permissions
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:ListClusters
                Resource: '*'
              # CloudFormation permissions
              - Effect: Allow
                Action:
                  - cloudformation:*
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${EnvironmentName}*'
              # S3 for templates
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${TemplatesBucketName}'
                  - !Sub 'arn:aws:s3:::${TemplatesBucketName}/*'

Outputs:
  ClusterName:
    Description: EKS Cluster name
    Value: !GetAtt EksClusterStack.Outputs.ClusterName

  ECRRepositoryUri:
    Description: ECR Repository URI for the application image
    Value: !GetAtt EcrStack.Outputs.RepositoryUri

  DeployRoleArn:
    Description: IAM Role ARN for GitHub Actions
    Value: !GetAtt GitHubActionsDeployRole.Arn

  VpcId:
    Description: VPC ID
    Value: !GetAtt NetworkingStack.Outputs.VpcId
