AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Axon PoC - EKS Cluster Stack
  EKS cluster with managed node group.

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name prefix

  VpcId:
    Type: String
    Description: VPC ID from networking stack

  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs for EKS cluster

  NodeInstanceType:
    Type: String
    Default: t3.large
    Description: EC2 instance type for worker nodes

  NodeGroupDesiredSize:
    Type: Number
    Default: 3

  NodeGroupMinSize:
    Type: Number
    Default: 2

  NodeGroupMaxSize:
    Type: Number
    Default: 4

Resources:
  # EKS Cluster IAM Role
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-cluster-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  # EKS Cluster Security Group
  ClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EKS Cluster security group
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-cluster-sg'

  # EKS Cluster
  EksCluster:
    Type: AWS::EKS::Cluster
    DependsOn: ClusterRole
    Properties:
      Name: !Sub '${EnvironmentName}-cluster'
      Version: '1.31'
      RoleArn: !GetAtt ClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref ClusterSecurityGroup
        EndpointPublicAccess: true
        EndpointPrivateAccess: true

  # Node Group IAM Role
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-node-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  # Managed Node Group
  NodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EksCluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-cluster'
      NodegroupName: !Sub '${EnvironmentName}-nodes'
      NodeRole: !GetAtt NodeRole.Arn
      Subnets: !Ref PrivateSubnetIds
      ScalingConfig:
        DesiredSize: !Ref NodeGroupDesiredSize
        MinSize: !Ref NodeGroupMinSize
        MaxSize: !Ref NodeGroupMaxSize
      InstanceTypes:
        - !Ref NodeInstanceType
      AmiType: AL2_x86_64
      DiskSize: 50
      Tags:
        Name: !Sub '${EnvironmentName}-node'

  # OIDC Provider for IRSA (IAM Roles for Service Accounts)
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    DependsOn: EksCluster
    Properties:
      Url: !GetAtt EksCluster.OpenIdConnectIssuerUrl
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - '9e99a48a9960b14926bb7f3b02e22da2b0ab7280'

Outputs:
  ClusterName:
    Description: EKS Cluster name
    Value: !Ref EksCluster

  ClusterEndpoint:
    Description: EKS Cluster API endpoint
    Value: !GetAtt EksCluster.Endpoint

  OidcIssuer:
    Description: OIDC issuer URL (without https://)
    Value: !Select
      - 1
      - !Split
        - '//'
        - !GetAtt EksCluster.OpenIdConnectIssuerUrl

  OidcProviderArn:
    Description: OIDC Provider ARN for IRSA
    Value: !GetAtt OidcProvider.Arn

  NodeRoleArn:
    Description: Node IAM Role ARN
    Value: !GetAtt NodeRole.Arn
