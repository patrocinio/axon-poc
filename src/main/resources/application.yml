spring:
  application:
    name: axon-poc-loan-originations

# Axon Server connection — uses K8s service DNS
axon:
  axonserver:
    servers: ${AXON_SERVER_HOST:localhost}:${AXON_SERVER_PORT:8124}
    # Client identification for Axon Server dashboard
    client-id: ${HOSTNAME:loan-originations-poc}
    component-name: loan-originations
    # Access token for authenticated connection to Axon Server
    token: ${AXON_SERVER_TOKEN:}

  # Event processing configuration
  eventhandling:
    processors:
      # Default tracking processor (can replay from event store)
      default:
        mode: tracking
        thread-count: 2
        batch-size: 100

# Actuator for health checks (EKS readiness/liveness probes)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

server:
  port: 8080

# H2 in-memory for token/saga store (PoC only)
spring.datasource:
  url: jdbc:h2:mem:axonpoc;DB_CLOSE_DELAY=-1
  driver-class-name: org.h2.Driver
spring.jpa:
  hibernate:
    ddl-auto: update
